server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Aset ber-hash: aman di-cache selamanya.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Font self-host (syarat offline PWA — PRD 01 §4.2).
  location ~* \.(woff2|woff)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker & manifest tidak boleh basi — kalau di-cache, pengguna
  # terjebak di versi lama dan toast "Versi baru tersedia" tidak pernah muncul.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { } default_type application/manifest+json;
  }

  # SPA: seluruh rute dilayani index.html (routing di klien, architecture.md §8).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
