services:
  # Pengembangan: docker compose up web
  web:
    build:
      context: .
      target: dev
    ports:
      - '1311:1311'
    volumes:
      - .:/app
      # node_modules tetap milik container — biar binary Linux tidak tertimpa
      # node_modules milik host (Windows).
      - /app/node_modules
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
    profiles: ['dev']

  # Produksi lokal: docker compose --profile prod up --build web-prod
  web-prod:
    build:
      context: .
      target: prod
      args:
        VITE_API_MODE: mock
        VITE_APP_VERSION: 0.1.0
    ports:
      - '8080:80'
    profiles: ['prod']
