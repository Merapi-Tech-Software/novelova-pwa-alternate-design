<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Kertas putaran 7, bukan `#d09a93` rose-gold v1. Warna ini mengecat bilah
      status ponsel dan latar aplikasi terpasang — ia hal pertama yang terlihat,
      dan yang tertinggal satu putaran paling kentara justru di sana.
    -->
    <meta name="theme-color" content="#f4f2ef" />
    <meta name="description" content="Baca novel Indonesia, satu bab setiap hari." />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!--
      iOS: mode berdiri sendiri + layar pembuka.

      Apple hanya menampilkan splash bila media query-nya **cocok persis**, jadi
      keempatnya menyebut lebar, tinggi, dan rasio piksel perangkatnya. Yang
      tidak cocok tetap mendapat layar kosong — sama seperti sebelum ada berkas
      ini, tidak lebih buruk.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Novelova" />
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
    />

    <title>Novelova</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
